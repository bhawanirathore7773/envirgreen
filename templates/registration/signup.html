{% extends "base.html" %}
{% load static %}
{% block title %}Join Envirgreen{% endblock %}
{% block content %}
<div class="container section auth-card" style="max-width:420px;">
  <img class="auth-logo" src="{% static 'images/envirgreen-mark.svg' %}" alt="EnvirGreen">
  <h1>Join Envirgreen</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <p class="muted">Already a member? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
