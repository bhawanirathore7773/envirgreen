{% extends "base.html" %}
{% load static %}
{% block title %}Log in — Envirgreen{% endblock %}
{% block content %}
<div class="container section auth-card" style="max-width:420px;">
  <img class="auth-logo" src="{% static 'images/envirgreen-mark.svg' %}" alt="EnvirGreen">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
</div>
{% endblock %}
