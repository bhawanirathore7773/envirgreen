{% extends "base.html" %}
{% block title %}Plant a tree — Envirgreen{% endblock %}
{% block content %}
<div class="container section" style="max-width:560px;">
  <h1>Log a tree planting</h1>
  <p class="muted">It'll show as "Planted" until the team verifies it, then track through to "Survived".</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Log planting</button>
  </form>
</div>
{% endblock %}
